<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    {% include 'nav.html' %}
    <div class="content-page">
        <h1>{{ title }}</h1>
        <img src="{{ image_url }}" alt="Cover for {{ title }}" style="max-width: 300px; border-radius: 8px;">
        <audio controls src="{{ audio_url }}"></audio>
        <div>
            <h2>Lyrics</h2>
            {{ content }}
        </div>
    </div>
</body>
</html>
